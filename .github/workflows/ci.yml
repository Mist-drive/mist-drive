name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            desktop/go.sum
      # Desktop lint type-checks the wails cgo runtime, needs the gtk/webkit headers.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Built from source so it matches the go.mod toolchain.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Check (fmt + vet + race + lint)
        run: make check
      - name: Integration tests
        run: cd api && go test -tags=integration -timeout=300s ./...
