name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Check (fmt + vet + race)
        run: make check
      - name: Integration tests
        run: cd api && go test -tags=integration -timeout=300s ./...
